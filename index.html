<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAAD GAMING</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080b0e;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px 15px;
  background: #10171d;
  border-bottom: 2px solid #39ff88;
}

.logo { font-size: 25px; font-weight: bold; color: #39ff88; }
header p { color: #b5c2cc; margin-bottom: 0; }

nav {
  display: flex;
  gap: 10px;
  padding: 12px;
  overflow-x: auto;
  background: #10171d;
}

nav button {
  flex-shrink: 0;
  background: #202b32;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
}

nav button.active { background: #39ff88; color: #07110b; }

main { max-width: 750px; margin: auto; padding: 15px; }

.search {
  width: 100%;
  padding: 14px;
  background: #151d24;
  color: white;
  border: 1px solid #304039;
  border-radius: 12px;
  font-size: 16px;
}

h2 { color: #39ff88; font-size: 20px; margin-top: 25px; }

.video-card {
  background: #131a20;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 20px;
  border: 1px solid #25342c;
}

video { display: block; width: 100%; max-height: 450px; background: black; }

.video-info { padding: 13px; }
.video-info h3 { margin: 0 0 8px; }
.video-info p { color: #aab5bd; font-size: 14px; }
.tag { color: #39ff88; font-size: 12px; }

.upload-box {
  background: #131a20;
  border: 1px dashed #39ff88;
  border-radius: 14px;
  padding: 18px;
  margin-top: 25px;
}

input, textarea, select { font: inherit; }

#videoFile, #videoTitle, #videoType { width: 100%; margin: 10px 0; }

#videoTitle, #videoType {
  padding: 12px;
  background: #202b32;
  border: 1px solid #304039;
  border-radius: 8px;
  color: white;
}

.action {
  width: 100%;
  padding: 13px;
  background: #39ff88;
  color: #07110b;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
  margin-top: 10px;
}

.action:disabled { opacity: .5; }

footer {
  padding: 25px 10px;
  text-align: center;
  color: #9aa6af;
  border-top: 1px solid #26342d;
}

#loginEmail, #loginPass {
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  background: #202b32;
  border: 1px solid #304039;
  border-radius: 8px;
  color: white;
}

.owner-link { color: #9aa6af; font-size: 13px; text-decoration: none; }

[hidden] { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="logo">🎮 SAAD GAMING</div>
  <p>عالمك، لعبك، وفيديوهاتك!</p>
</header>

<nav>
  <button class="active" data-filter="all">🏠 الرئيسية</button>
  <button data-filter="short">📱 فيديوهات قصيرة</button>
  <button data-filter="long">🎬 فيديوهات طويلة</button>
  <button id="goUpload" hidden>➕ أضف فيديو</button>
</nav>

<main>

  <input class="search" id="search" type="search"
    placeholder="🔍 ابحث عن فيديو..." aria-label="البحث عن فيديو">

  <h2>🔥 أحدث الفيديوهات</h2>

  <p id="loading">جاري تحميل الفيديوهات...</p>
  <section id="videoList"></section>
  <p id="empty" hidden>لم يتم العثور على فيديو.</p>

  <section class="upload-box" id="uploadBox" hidden>
    <h2>➕ أضف فيديو من هاتفك</h2>
    <p>اختر مقطعاً محفوظاً على هاتفك ليُنشر للجميع.</p>

    <input type="text" id="videoTitle" placeholder="اكتب عنوان الفيديو" maxlength="100">

    <select id="videoType">
      <option value="short">📱 فيديو قصير</option>
      <option value="long">🎬 فيديو طويل</option>
    </select>

    <input type="file" id="videoFile" accept="video/*">

    <button class="action" id="publish">نشر الفيديو</button>

    <p id="message" aria-live="polite"></p>

    <button class="action" id="logout" style="background:#202b32;color:white">تسجيل الخروج</button>
  </section>

  <section class="upload-box" id="loginBox" hidden>
    <h2>🔒 دخول المالك</h2>
    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="username">
    <input type="password" id="loginPass" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="action" id="loginBtn">دخول</button>
    <p id="loginMsg" aria-live="polite"></p>
  </section>

</main>

<footer>
  © 2026 SAAD GAMING 🎮
  <br>
  جميع الحقوق محفوظة لصاحب الموقع.
  <br><br>
  <a href="#" id="ownerLink" class="owner-link">🔒 دخول المالك</a>
</footer>

<script>
// ===== إعدادات Supabase =====
const SUPABASE_URL = "https://lzmijvtcfbukyzttbysr.supabase.co";
const SUPABASE_KEY = "sb_publishable_R0ZUp04QxzZ4CPS3h8A-0Q_tEJpIaxs";
const BUCKET = "videos";
const MAX_MB = 50; // حد الرفع في الخطة المجانية

const search = document.getElementById("search");
const list = document.getElementById("videoList");
const empty = document.getElementById("empty");
const loading = document.getElementById("loading");
const fileInput = document.getElementById("videoFile");
const titleInput = document.getElementById("videoTitle");
const typeInput = document.getElementById("videoType");
const publishBtn = document.getElementById("publish");
const message = document.getElementById("message");

let currentFilter = "all";

function createCard(v) {
  const card = document.createElement("article");
  card.className = "video-card";
  card.dataset.type = v.type === "short" ? "short" : "long";

  const video = document.createElement("video");
  video.controls = true;
  video.playsInline = true;
  video.preload = "metadata";
  video.src = v.url;

  const info = document.createElement("div");
  info.className = "video-info";

  const h = document.createElement("h3");
  h.textContent = v.title;

  const p = document.createElement("p");
  p.textContent = new Date(v.created_at).toLocaleDateString("ar");

  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = v.type === "short" ? "فيديو قصير" : "فيديو طويل";

  info.append(h, p, tag);
  card.append(video, info);
  return card;
}

function filterVideos() {
  const query = search.value.trim().toLowerCase();
  let count = 0;

  document.querySelectorAll(".video-card").forEach(card => {
    const matchesText = card.textContent.toLowerCase().includes(query);
    const matchesType = currentFilter === "all" || card.dataset.type === currentFilter;
    card.hidden = !(matchesText && matchesType);
    if (!card.hidden) count++;
  });

  empty.hidden = count !== 0;
}

async function loadVideos() {
  try {
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/videos?select=*&order=created_at.desc",
      { headers: { apikey: SUPABASE_KEY } }
    );
    if (!res.ok) throw new Error(await res.text());
    const videos = await res.json();

    list.innerHTML = "";
    videos.forEach(v => list.append(createCard(v)));
    loading.hidden = true;
    filterVideos();
  } catch (err) {
    loading.textContent = "تعذر تحميل الفيديوهات. تحقق من الإنترنت.";
    console.error(err);
  }
}

search.addEventListener("input", filterVideos);

document.querySelectorAll("nav button[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    currentFilter = button.dataset.filter;
    document.querySelectorAll("nav button[data-filter]")
      .forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    filterVideos();
  });
});

document.getElementById("goUpload").addEventListener("click", () => {
  document.getElementById("uploadBox").scrollIntoView({ behavior: "smooth" });
});

publishBtn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  const title = titleInput.value.trim();

  if (!file) { message.textContent = "اختر فيديو من هاتفك أولاً."; return; }
  if (!file.type.startsWith("video/")) { message.textContent = "الرجاء اختيار ملف فيديو."; return; }
  if (file.size > MAX_MB * 1024 * 1024) {
    message.textContent = "الفيديو أكبر من " + MAX_MB + " ميغابايت.";
    return;
  }

  publishBtn.disabled = true;
  message.textContent = "جاري رفع الفيديو... لا تغلق الصفحة ⏳";

  try {
    const token = await getToken();
    if (!token) throw new Error("login");

    const ext = (file.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "");
    const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;

    const up = await fetch(
      SUPABASE_URL + "/storage/v1/object/" + BUCKET + "/" + path,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + token,
          "Content-Type": file.type
        },
        body: file
      }
    );
    if (!up.ok) throw new Error(await up.text());

    const publicUrl = SUPABASE_URL + "/storage/v1/object/public/" + BUCKET + "/" + path;

    const ins = await fetch(SUPABASE_URL + "/rest/v1/videos", {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + token,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: JSON.stringify({
        title: title || file.name,
        type: typeInput.value,
        url: publicUrl
      })
    });
    if (!ins.ok) throw new Error(await ins.text());

    fileInput.value = "";
    titleInput.value = "";
    message.textContent = "تم نشر الفيديو بنجاح ✅";
    await loadVideos();
  } catch (err) {
    console.error(err);
    message.textContent = err.message === "login"
      ? "انتهت الجلسة، سجّل الدخول من جديد."
      : "فشل الرفع ❌ تأكد من حجم الفيديو والإنترنت.";
  } finally {
    publishBtn.disabled = false;
  }
});

// ===== تسجيل دخول المالك =====
const SESSION_KEY = "saad_session";

function saveSession(x) { try { localStorage.setItem(SESSION_KEY, JSON.stringify(x)); } catch (e) {} }
function readSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; } }
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }

async function authRequest(grant, body) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=" + grant, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error("auth");
  const d = await res.json();
  const sess = {
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    expires_at: Date.now() + d.expires_in * 1000
  };
  saveSession(sess);
  return sess;
}

async function getToken() {
  let sess = readSession();
  if (!sess) return null;
  if (sess.expires_at - Date.now() < 60000) {
    try {
      sess = await authRequest("refresh_token", { refresh_token: sess.refresh_token });
    } catch (e) {
      clearSession();
      showOwner(false);
      return null;
    }
  }
  return sess.access_token;
}

function showOwner(on) {
  document.getElementById("uploadBox").hidden = !on;
  document.getElementById("goUpload").hidden = !on;
  document.getElementById("ownerLink").hidden = on;
  if (on) document.getElementById("loginBox").hidden = true;
}

document.getElementById("ownerLink").addEventListener("click", e => {
  e.preventDefault();
  const box = document.getElementById("loginBox");
  box.hidden = !box.hidden;
  if (!box.hidden) box.scrollIntoView({ behavior: "smooth" });
});

document.getElementById("loginBtn").addEventListener("click", async () => {
  const msg = document.getElementById("loginMsg");
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPass").value;
  if (!email || !password) { msg.textContent = "اكتب البريد وكلمة المرور."; return; }

  msg.textContent = "جاري الدخول...";
  try {
    await authRequest("password", { email, password });
    document.getElementById("loginPass").value = "";
    msg.textContent = "";
    showOwner(true);
  } catch (e) {
    msg.textContent = "البريد أو كلمة المرور خاطئة ❌";
  }
});

document.getElementById("logout").addEventListener("click", () => {
  clearSession();
  showOwner(false);
});

showOwner(!!readSession());
loadVideos();
</script>

</body>
</html>
